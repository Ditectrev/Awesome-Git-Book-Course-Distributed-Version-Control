### What is Git? <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* A distributed version control system (DVCS) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Tracks changes to files over time <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* A complete copy can hold the full history <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Official home: [git-scm.com](https://git-scm.com/) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Docs: [Git documentation](https://git-scm.com/doc) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

### What Problem Version Control Solves <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Overwriting <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* No latest copy (`final-v2`, `final-FINAL`) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* No audit trail <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Fear of changing things <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Review is guesswork <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### What Problem Version Control Solves <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Snapshots, not a pile of copies <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Parallel work on branches <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Attribution on commits <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Recovery with a record <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

### What Problem Version Control Solves <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* A shared drive is not version control <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Chat attachments move bytes, not history <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

## History and Evolution of Git <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

---

### Before Git: Centralized Version Control <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

---

### Before Git: Centralized Version Control <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* One server held the history <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* You checked out a working copy, not a full clone <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Update, commit, branch, and tag were server operations <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* If the server was down, you could type, not record history <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Before Git: Centralized Version Control <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* [GNU RCS](https://www.gnu.org/software/rcs/) — file-level revisions <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [CVS](https://www.nongnu.org/cvs/) — multi-file projects on a central server <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [Apache Subversion](https://subversion.apache.org/) — atomic commits, still centralized <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [Perforce P4](https://www.perforce.com/products/helix-core) — still used for large binary-heavy trees <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* We name these tools; we do not run them <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Before Git: Centralized Version Control <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* A single latest copy everyone could name <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Permissions on one server <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Check out, edit, check in <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Before Git: Centralized Version Control <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Single point of failure <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Offline work was a lie: you could not commit <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Branching at [Linux kernel](https://www.kernel.org/) scale was the painful part <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Geographically distributed work vs one admin-owned server <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Before Git: Centralized Version Control <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* [Linux kernel](https://www.kernel.org/) 1991–2002: patches and archive files <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* 2002: the kernel adopted [BitKeeper](https://www.bitkeeper.org/) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [BitKeeper](https://www.bitkeeper.org/) was a proprietary distributed SCM <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* That is the bridge to [Git](https://git-scm.com/) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Before Git: Centralized Version Control <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Centralized = one server owns history <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [Git](https://git-scm.com/) is not that <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [GitHub](https://github.com/) will *look* like one server <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Underneath it is still a distributed [Git](https://git-scm.com/) repository <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Linus Torvalds and the Birth of Git <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

---

### Linus Torvalds and the Birth of Git <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* The [Linux kernel](https://www.kernel.org/) needed speed, distribution, and its own license <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* 2002: kernel work on [BitKeeper](https://www.bitkeeper.org/) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Proprietary, with a free-of-charge arrangement for kernel work <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Maintainers exchanged history without one [CVS](https://www.nongnu.org/cvs/) server <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Linus Torvalds and the Birth of Git <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* 2005: the [BitKeeper](https://www.bitkeeper.org/) relationship broke down <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* The free-of-charge status was revoked <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Source: [Pro Git: A Short History of Git](https://git-scm.com/book/en/v2/Getting-Started-A-Short-History-of-Git) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Linus Torvalds wrote [Git](https://git-scm.com/) as a replacement <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Linus Torvalds and the Birth of Git <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Speed <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Simple design <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Strong support for non-linear development <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Fully distributed <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Scale to the [Linux kernel](https://www.kernel.org/) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Linus Torvalds and the Birth of Git <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* First [Git](https://git-scm.com/) commit: **April 7, 2005** <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Source: [GitHub Blog: Git turns 20](https://github.blog/open-source/git/git-turns-20-a-qa-with-linus-torvalds/) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Within days it was recording kernel history <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Cheap branches are why the tool exists, not a later add-on <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Linus Torvalds and the Birth of Git <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Open source under the [GNU GPL version 2.0](https://www.gnu.org/licenses/old-licenses/gpl-2.0.html) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Home: [git-scm.com](https://git-scm.com/) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* About: [Git about](https://git-scm.com/about) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Docs: [Git documentation](https://git-scm.com/doc) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Mirror: [git/git](https://github.com/git/git) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Linus Torvalds and the Birth of Git <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Not [GitHub](https://github.com/) — that is 2008 <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Not a required central server <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Not a social network <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Kernel history today: [git.kernel.org](https://git.kernel.org/) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

### Distributed Version Control as a Design Choice <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

---

### Distributed Version Control as a Design Choice <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Centralized: the server *is* the repository <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [Git](https://git-scm.com/): a clone is a repository <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Commits, branches, and tags travel with the clone <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [GitHub](https://github.com/) is a convenient copy with a web UI <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Distributed Version Control as a Design Choice <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* No single copy of history <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Commit without the network (local [Git](https://git-scm.com/)); we use the host in the browser <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Cheap branches: a name pointing at a commit <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Review is a graph operation; pull requests are host UI <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Distributed Version Control as a Design Choice <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* [Mercurial](https://www.mercurial-scm.org/) — the sibling DVCS from 2005 <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Also a [BitKeeper](https://www.bitkeeper.org/) alternative <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Official site: [mercurial-scm.org](https://www.mercurial-scm.org/) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Same job, different tool; we do not run it <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Distributed Version Control as a Design Choice <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Centralized: the server has the database; you have a working copy <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

### Snapshots, Not File Diffs <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Older tools think in deltas (a base file plus line changes) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [CVS](https://www.nongnu.org/cvs/), [Apache Subversion](https://subversion.apache.org/), [Perforce P4](https://www.perforce.com/products/helix-core) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [Git](https://git-scm.com/) stores snapshots of the whole tree <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Source: [Pro Git: What is Git?](https://git-scm.com/book/en/v2/Getting-Started-What-is-Git%3F) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Snapshots, Not File Diffs <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Each commit is a picture of tracked files at that moment <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Unchanged files reuse the same blob <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* A tree names which blob sits at which path <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Internals: [Pro Git: Git Objects](https://git-scm.com/book/en/v2/Git-Internals-Git-Objects) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Appendix C goes deeper; a commit is not a patch file <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Snapshots, Not File Diffs <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Humans review changes, not entire files <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [GitHub](https://github.com/) *computes* a diff between two snapshots <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [Comparing commits](https://docs.github.com/en/pull-requests/committing-changes-to-your-project/viewing-and-comparing-commits/comparing-commits) is that view <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [Git data model](https://git-scm.com/docs/gitdatamodel): [Git](https://git-scm.com/) does not store the diff <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Storage is still a snapshot, not a list of diffs <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Snapshots, Not File Diffs <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Every commit is a complete project <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Unchanged files are cheap (shared blobs) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Branches are cheap: a name for a snapshot <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Think snapshots; read diffs <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

### Commits as Immutable History <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* We add; we do not edit in place <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Commit changes on [GitHub](https://github.com/) creates a *new* commit <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* The old commit stays in the graph <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [Git](https://git-scm.com/) generally only adds data <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

### Commits as Immutable History <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Revert adds a commit that undoes an old one <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* The mistaken commit remains <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Amend, rebase, force-push: Appendix A <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* No force-push button in the basic web editor <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

### Commits as Immutable History <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Not a pull request (host review object) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Not a backup of untracked files or secrets <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Sloppy message: add a follow-up commit <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Future work is a new commit <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

### The Directed Acyclic Graph (DAG) <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Directed: each commit points at its parent(s) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Arrows go backward in time <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Acyclic: no loops <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Graph: more than one line of work at once <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### The Directed Acyclic Graph (DAG) <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Root commit: no parent <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Ordinary commit: one parent <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Merge commit: two or more parents <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Diverged branches: two tips, shared ancestor <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [Pro Git: Branches in a Nutshell](https://git-scm.com/book/en/v2/Git-Branching-Branches-in-a-Nutshell) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### The Directed Acyclic Graph (DAG) <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* A branch is a movable name pointing at a commit <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Cheap because it is a pointer, not a copy <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Names live on top of the graph <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [Pro Git: Git References](https://git-scm.com/book/en/v2/Git-Internals-Git-References) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

### Hashes, SHAs, and Why Identity Matters <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Every object is named by a hash of its contents <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Blob, tree, commit, tag <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* You cannot change content without [Git](https://git-scm.com/) knowing <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [Pro Git: What is Git?](https://git-scm.com/book/en/v2/Getting-Started-What-is-Git%3F) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [hash function transition](https://git-scm.com/docs/hash-function-transition) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Hashes, SHAs, and Why Identity Matters <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* [SHA-1](https://csrc.nist.gov/projects/hash-functions): 40 hex characters <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [GitHub](https://github.com/) shortens it in lists (often 7 characters) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* The full hash is the identity <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [GitHub Docs: About commits](https://docs.github.com/en/pull-requests/committing-changes-to-your-project/creating-and-editing-commits/about-commits) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Hashes, SHAs, and Why Identity Matters <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Same bytes → same blob hash <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Change one byte → new blob hash <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Change message, parent, or tree → new commit hash <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Editing history rewrites a chain (Appendix A) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Hashes, SHAs, and Why Identity Matters <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* [Git](https://git-scm.com/) successor hash: [SHA-256](https://csrc.nist.gov/projects/hash-functions) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* 64 hex characters <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Spec: [NIST hash functions](https://csrc.nist.gov/projects/hash-functions) / [FIPS 180-4](https://csrc.nist.gov/pubs/fips/180-4/upd1/final) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* [GitHub](https://github.com/) main path in this book: [SHA-1](https://csrc.nist.gov/projects/hash-functions) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* You do not need [SHA-256](https://csrc.nist.gov/projects/hash-functions) for this course <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Hashes, SHAs, and Why Identity Matters <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* The SHA is the name of the object <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* URLs, pull requests, compare, revert hang off that ID <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* "The same commit" means the same hash <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Identical content, identical name <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

* Every complete copy can hold the DAG <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

### Summary: Core Principles of Git <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Snapshots, not a list of file diffs <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Three areas: working tree, staging area, repository <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Commits are immutable; we add, we do not rewrite <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* History is a DAG; a branch is a name on that graph <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* The SHA is the name of the object <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Distributed: each complete copy holds the graph <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Next: The Browser Lab <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

### Merge, Squash and Merge, and Rebase and Merge <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

#### Fast-Forward vs a Merge Commit <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

#### Fast-Forward vs a Merge Commit <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Fast-forward: the base name slides to a commit that already exists <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Docs: [Pro Git: Basic Branching and Merging](https://git-scm.com/book/en/v2/Git-Branching-Basic-Branching-and-Merging) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Possible when `main` has not moved since you branched <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* No new snapshot; the SHA stays the one you made <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Fast-Forward vs a Merge Commit <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* **Create a merge commit** uses `--no-ff` <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* You get two parents even when a fast-forward was possible <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Squash and rebase fast-forward onto commits they just created <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Rebase and merge always writes new SHAs ([About merge methods](https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/configuring-pull-request-merges/about-merge-methods-on-github)) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* If `main` moved, a fast-forward is impossible; conflicts are a later chapter <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

#### When Each GitHub Merge Button Fits <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

---

#### When Each GitHub Merge Button Fits <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Same resulting tree; different history <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* **Create a merge commit:** keep the join and every branch commit <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Noisy `wip` commits stay on `main` too <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Use it when that trail is worth reading later <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### When Each GitHub Merge Button Fits <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* **Squash and merge:** one snapshot on the default branch <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* You lose the small commits' times and authors as separate objects on `main` <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Title the pull request in the imperative: `Add a squash practice line` <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Delete the branch; a later pull request from it can show those commits again <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### When Each GitHub Merge Button Fits <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* **Rebase and merge:** keep each subject, in a straight line <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* New SHAs; no merge bubble; not an interactive rebase <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* No force-push on this path (Appendix A) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* A merge queue or a ruleset can remove the dropdown <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

### What a Pull Request Is <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* A [GitHub](https://github.com/) proposal to merge one branch into another <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Docs: [Pull requests](https://docs.github.com/en/pull-requests/reference/pull-requests) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Not a [Git](https://git-scm.com/) object; the commits are <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* **Base** is the destination (`main`) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* **Compare** (head) is the branch with the new commits <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

### What a Pull Request Is <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* **Conversation** — description, timeline, comments <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* **Commits** — snapshots on the head branch <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* **Checks** — automation; empty on `hello-git` <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* **Files changed** — the diff reviewers read <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* The merge box holds the three buttons and any blockers <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

### Fork vs Clone as a Mental Model <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Branch: a name inside one repository <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Fork: a separate [GitHub](https://github.com/) repository linked to **upstream** <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Docs: [Forks](https://docs.github.com/en/pull-requests/reference/forks) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* A fork copies history; a template repository does not <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Clone: a copy on a machine ([Cloning a repository](https://docs.github.com/en/repositories/creating-and-managing-repositories/cloning-a-repository)) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* We fork. We do not clone <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

### Why Conflicts Happen <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

### Why Conflicts Happen <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* [Git](https://git-scm.com/) compares both tips with their common ancestor <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Different lines or different files can merge alone <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Docs: [Merge conflicts](https://docs.github.com/en/pull-requests/reference/merge-conflicts) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Same line, changed on both sides, cannot <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Edit on one side and delete on the other cannot either <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* The merge button turns off until a person chooses the text <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

### The GitHub Conflict Editor <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* **Resolve conflicts** edits a simple line conflict on the pull request <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

* **Commit merge** merges the entire base branch into the head branch <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* You still merge the pull request afterward <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Leave **Fix with Copilot** if it appears <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

### The GitHub Conflict Editor <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

### Preventing Conflicts with Smaller Pull Requests <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Fewer lines overlap less; appending can still collide <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* A branch that sits while `main` moves overlaps more <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* **Update branch** merges base into head when there is no conflict yet <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Docs: [Keeping your pull request in sync with the base branch](https://docs.github.com/en/pull-requests/how-tos/create-pull-requests/keeping-your-pull-request-in-sync-with-the-base-branch) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* **Update with rebase** rewrites commits; leave it for Appendix A <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

### Reverting a Commit or a Pull Request on GitHub <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* A revert is a new commit that undoes an older change <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Docs: [Reverting a pull request](https://docs.github.com/en/pull-requests/how-tos/merge-and-close-pull-requests/reverting-a-pull-request) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Object: [git-revert](https://git-scm.com/docs/git-revert) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* **Revert** on the merged pull request opens another pull request <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* It undoes that pull request's effect, not the whole file <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Reverting a Commit or a Pull Request on GitHub <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Merge the revert with **Create a merge commit** <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* `main` shows `Conflict practice: left side.` again <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* The right-side commits and the resolution are still in history <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* `main` moved forward; it did not rewind to an old SHA <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

### What You Cannot Undo in the Web UI <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Revert and delete-on-the-tip leave the old snapshot <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* No reset and no reflog (Appendix B) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* No force-push and no amend (Appendix A) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* No "unresolve" for **Commit merge** <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* **Resolve conflicts** stays off when [GitHub](https://github.com/) will not show the file <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Closing a pull request does not undo a merge that already landed <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

## Releases, Ignore Files, and Repository Hygiene

---

* `hello-git` has history you can still open <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* This chapter: what you keep out of it, and how you name a version <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Still no local Git install <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Still no real password, key, or token — not even as a test <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

* Add a short `.gitignore` on `main` <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Publish a GitHub release `v0.1.0` pointed at that branch <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* The number is Semantic Versioning <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* The tag names one commit. The release is the GitHub page on that tag <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### What a gitignore File Is For

---

* A list of patterns for untracked files <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Git leaves matching paths out of the next commit <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Commit the file so the rules are shared <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* A laptop-only ignore file is a later chapter <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

* Does not delete a path already in a commit <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Deleting the file on the tip leaves older blobs in place <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Does not lock the Commit changes button <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Creating a matching file by hand and committing it is an explicit add <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

* Working rule: untracked junk stays out of future snapshots <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* History is not scrubbed <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Common Ignore Patterns

---

* `.DS_Store` — macOS folder metadata <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* `.env` — convention for passwords and tokens <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* `*.log` — names ending in `.log` <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* `node_modules/` — a trailing slash means a directory <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* `!` un-ignores one path. You do not need it here <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

* Add file, name it `.gitignore` <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Leave any template list unset <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Type `.DS_Store`, `.env`, and `*.log` <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Commit to `main`: Ignore local metadata, env files, and logs <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Do not add a file named `.env` <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

* Working rule: ignore generated files, machine metadata, and secret-shaped names <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Commit the `.gitignore` file itself <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### The GitHub gitignore Template Picker

---

* Menus come from github/gitignore <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Same catalog as the create-repository menu you left unset <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* A language template fits a real project in that language <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* It does not fit a README-only practice repo <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

* Working rule: the picker is a starter catalog, not a complete policy <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* For `hello-git`, the lines you typed are the whole rule set <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Secrets That Must Never Be Committed

---

* Passwords, API tokens, private keys, connection strings, a real `.env` <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Commit the name `.env` in `.gitignore`. Do not commit the file <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* A private repository is still stored on GitHub <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Deleting the file on `main` removes it from the tip only <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

* Secret scanning on public repositories is automatic and free <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Push protection for your user blocks known secret patterns on public pushes <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Known patterns are not every password you invent <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Do not type a real token to watch the block <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

* First move if a secret is already in a commit: revoke or rotate it <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Erasing the blob from history rewrites every later SHA <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* The web editor has no button for that rewrite <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

* Working rule: secrets never go in a commit, public or private <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Scanning is a backstop. Revoke a leak. A delete-commit is not a purge <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Tags vs Releases

---

* A tag is a Git name for one commit <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* A branch moves when you commit. A tag stays <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Lightweight: a name. Annotated: its own object, with a message <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* You do not hand-build that object in the web UI <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

* A release is a GitHub page attached to a tag <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Title, notes, optional files, plus source zip and tarball <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Tag date and release date can differ <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Read access views a release. Write access publishes one <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

* Working rule: the tag names the commit. The release announces the name <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Moving a tag to another commit is a rewrite <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Creating a Release on GitHub

---

* Releases → Draft a new release <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Choose a tag: type `v0.1.0`, then Create new tag <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Target: `main`, after `.gitignore` is committed <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Title `0.1.0`. One sentence in the notes <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Leave pre-release unchecked. Do not attach a binary <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Publish release <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

* The zip is that commit, not whatever `main` is next week <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* A later commit does not change this release <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* The next version is a new tag <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

* Working rule: publish `v0.1.0` from `main` after the ignore file <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Notes say why the tag exists <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Semantic Versioning in Practice

---

* `MAJOR.MINOR.PATCH` <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Patch: a compatible fix. Minor: a compatible addition <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Major: a breaking change <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* `0.y.z` is initial development. Breaking changes are still allowed <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

* `v` is a tag prefix, not part of the three numbers <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* The title can be `0.1.0` while the tag is `v0.1.0` <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Spec pre-release: `1.0.0-rc.1` <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* GitHub's pre-release checkbox is a label, not that hyphen <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

* Do not reuse `v0.1.0` for a later commit <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Next tag: `v0.1.1`, `v0.2.0`, or `v1.0.0` — whichever the change requires <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

* Working rule: the tag records which snapshot the number means <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Increase the leftmost number the change requires <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Summary: Releases, Ignore Files, and Repository Hygiene

---

* `.gitignore` skips untracked paths. It does not purge history <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* You wrote `.DS_Store`, `.env`, and `*.log`. The template menu stayed unset <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Secrets stay out of every repository. Revoke a leak. A delete is not a rewrite <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Tag names the commit. Release is the GitHub page. You published `v0.1.0` <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Semantic Versioning: `0.1.0`, with `v` only on the tag <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

### Collaborators, Teams, and Permissions

---

* A collaborator is a GitHub account you invite <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* The invite is host access. It is not a Git commit <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Personal repository: owner, and collaborators <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* A private personal repo grants collaborators write, not read-only <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

* Teams exist on an organization <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Org roles: Read, Triage, Write, Maintain, Admin <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* You sign in as yourself. Do not create an organization <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

* Settings → Access → Collaborators <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Leave the box empty when you are practicing alone <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* One invite, to a username that expects it. Cancel a pending invite on the same page <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Removing a collaborator from a private repo deletes their fork on GitHub <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

* Working rule: no invite is a complete result when you are alone <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Teams and the five org roles are not this repository <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

### Branch Protection and Rulesets

---

* Host settings about who may update a branch <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* A branch protection rule targets one name pattern <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* A ruleset can target the default branch, patterns, and tags <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Matching rulesets layer. There is no priority number <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

* Public repositories on GitHub Free include rulesets <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Private repositories need Pro, Team, or Enterprise Cloud <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* If the button is missing, do not flip visibility and do not start a trial <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Active applies immediately. Disabled is stored and does not apply <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

* New branch ruleset, name `practice-require-pr` <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Enforcement Disabled. Target the default branch <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Require a pull request. Leave required reviews off <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Do not add a classic branch protection rule beside it <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

* Working rule: Disabled lets you read the policy <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Active on `main` would block the direct commits this book still uses <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

### CODEOWNERS and Required Reviews

---

* Names people or teams for paths. GitHub reads it on a pull request <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* File lives in the root, `.github/`, or `docs/` <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* The copy that matters is on the base branch <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Drafts do not request code owners until they are ready <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

* Commit `.github/CODEOWNERS` on `main`: `* @YOUR-USERNAME` <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* You can commit the file on any plan <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Automatic review requests follow the plan: public on Free, public and private on paid plans <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Requiring their approval is a separate ruleset switch. Leave it off <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

* You cannot approve your own pull request <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* A required review that names only you would wait forever <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

* Working rule: the file records who should be asked <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* The ruleset is what makes that ask block the merge <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

## Common Challenges and Debugging Tips

---

* A commit on the wrong branch, a secret, a huge pull request, `master`, a blocked merge <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Still no local Git. Still no force-push, amend, or reset <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Still no live token, not even to test a scanner <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

* Commit one line on `main` by mistake <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Point `keep-line` at it, then revert on `main` <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Re-open `NOTES.md` in the old tree <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Confirm the default branch is `main` and the ruleset is Disabled <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### I Committed to the Wrong Branch

---

* Commit directly to `main` puts the snapshot on `main` <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* The web editor cannot lift that commit off the branch <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Make a new branch at that tip so the work stays reachable <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Revert on `main` adds an undo. The original commit stays <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

* Append `Wrong branch practice.` on `main` <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Create `keep-line` from `main` <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Revert that commit. Merge the revert with Create a merge commit <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* The line is gone on `main` and still on `keep-line` <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

* Working rule: branch to keep the work, revert where it does not belong <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Leave `keep-line`. Cherry-pick is Appendix B <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### I Committed a Secret

---

* First move: revoke or rotate the credential <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Deleting the file on the tip leaves the blob in older commits <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* `NOTES.md` is still in the tree for `Add a practice note` <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Do not paste the value into an issue, a pull request, or a discussion <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

* Push protection blocks known patterns on public pushes <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* It will not catch every password you invent <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Removing the blob rewrites later SHAs and needs a force-push <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* That procedure is Appendix A. Stop before the commands <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

* Working rule: a dead credential is the outcome you need <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* The old commits can stay <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### The Pull Request Is Too Big to Review

---

* Too big: unrelated files, or no one-sentence description <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* GitHub will still merge it. Reviewers will not read it <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* The web editor will not split one commit into several <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

* Mark it Draft, or close it <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* New branch from `main`, one piece, one pull request <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* The revert you just merged should be one file. Copy that size <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

* Working rule: one pull request, one sentence <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### GitHub Still Shows master as the Default Branch

---

* New repositories use `main` <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* `master` means an older repo, a rename, or a changed account default <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Renaming keeps the commits. GitHub redirects the old URLs <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

* Settings → General → Default branch on `hello-git` should say `main` <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Do not switch it to `keep-line` or to `master` <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

* Working rule: `main` stays the default on this repository <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* `master` is a branch name, not a different Git <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### The Merge Button Is Blocked

---

* Read the merge box before you change a setting <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Draft: Ready for review <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Conflicts: Resolve conflicts, when GitHub can show the file <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Ruleset or branch protection: reviews, code owners, or checks <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

* `practice-require-pr` stays Disabled <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* You cannot approve your own pull request <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* An empty Checks tab is not a failure <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

* Working rule: the merge box names the blocker <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

## Appendix A: Rebase and Rewriting History

---

* Merge keeps every SHA and adds a join <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Rebase copies commits onto a new base and mints new SHAs <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* No install. No force-push of `hello-git`. Do not move `v0.1.0` <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

* Re-open the commit Rebase and merge already wrote <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Complete Rebase Introduction in the sandbox, then stop <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Why Rebase Exists

---

* A merge commit records both tips. The old SHAs stay <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* A rebase asks what those changes would be on today's base <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* The copies are new commits. The branch name moves to them <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

* Working rule: rebase mints new SHAs. Merge keeps the old ones and adds a join <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Rebase and Merge on GitHub

---

* Copies each head commit onto the base, then fast-forwards <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* GitHub always writes new SHAs. Subjects stay. One parent <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* It does not reorder, squash, or edit messages <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* It does not force-push the head branch <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

* Open `Add a rebase practice line` on `main` <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* One parent. The SHA is not the one you noted on `rebase-line` <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Visual Rebase in Learn Git Branching

---

* Introduction sequence: Rebase Introduction <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* New dots on the other branch. The branch name leaves the old dots <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Stop there. Cherry-pick is Appendix B <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Do not type the sandbox's commands against `hello-git` <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Interactive Rebase, Squash, and Fixup

---

* `git rebase -i` shows a todo list. GitHub has no form for it <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* pick, reword, squash, fixup, drop <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Every copied commit gets a new SHA <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Squash and merge is one new commit, not that list <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

* Juggling Commits in the sandbox comes after cherry-pick. Leave it <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### When Not to Rewrite Published History

---

* Do not rebase commits other people may have based work on <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Do not move `v0.1.0`. One tag must not mean two commits <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Do not rewrite history to hide a secret. Revoke it <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* An unshared feature branch is the narrow case. Once someone else fetched it, it is published <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### git push --force

---

* A normal push is refused when the remote has commits you do not have <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* `--force` moves the branch name anyway <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Commits that drop off that name can be hard to find <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* You do not run this against `hello-git` <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### git push --force-with-lease

---

* Still a force-push <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Refused if the remote tip is not the one your remote-tracking branch recorded <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* People who already pulled the old SHAs still have the old history <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### When Force-Pushing Is Allowed vs Rewriting Published History

---

* Your unshared feature branch, before anyone else based work on it <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Not `main`, not a release tag, not a branch other people have fetched <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Do not force-push `hello-git` to tidy the practice commits <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Branch Rules That Block Force Pushes

---

* Branch protection blocks force-pushes unless someone allows them <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* A ruleset can block them too. The rejection is the rule working <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Do not disable `hello-git`'s rules, and do not add one just to watch it fail <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### No Force-Push Button in the GitHub Web Editor

---

* The editor adds a commit. It cannot replace `main` <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Rebase and merge writes new commits on the base <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Update with rebase rewrites the head branch. Leave it unclicked <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Cherry-pick a Single Commit

---

* Copies one commit's change onto the branch you are on <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* The result is a new SHA. The parent is your current tip <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Not a merge, and not a rebase of a whole range <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* A merge commit needs a chosen mainline parent. Skip those <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

* Moving and Staging Work: complete Cherry-pick Intro <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Stop before Interactive Rebase Intro <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* `keep-line` stays the only home of the practice line <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Revert vs Reset

---

* Revert adds a commit. The old SHA stays. Safe to push <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Reset moves the branch name <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* `--soft` keeps changes staged. `--mixed` unstages them. `--hard` discards uncommitted edits <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Publishing that moved branch is a force-push <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

* Ramping Up: complete Reversing Changes in Git <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Reset only the unpushed sandbox branch. Revert the one that was pushed <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* `main`, `keep-line`, and `v0.1.0` do not move <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Reflog as a Safety Net

---

* A local diary of where HEAD and the branch names pointed <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* `HEAD@{1}` is the previous position, not a parent <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* It is not pushed. GitHub does not show it <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* The Commits page is only what branches can still reach <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Bisect to Find a Bad Commit

---

* Mark one commit good and one bad. Git checks out the middle <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Each answer halves the range <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Ending the session is not a reset of `main` <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* No GitHub button, and no bisect level in the sandbox sequences we use <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Summary: Appendix B: Cherry-pick, Reset, Reflog, and Bisect

---

* Cherry-pick writes a new SHA. The sandbox is the only place you run it <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Revert adds a commit. Reset moves a name <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Reflog is local. Bisect needs a machine and a test <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
